<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No viewport-fit=cover: a page that pads itself by the safe-area insets jumps right after it appears, since
      WebKit hands them over only after the first frame and Capacitor's Android side learns of the meta tag only once
      the page is visible. The platform insets the web view instead — `ios.contentInset` in capacitor.config.ts,
      Capacitor's system-bar padding on Android — and paints the strips it leaves in the page's background, the
      `PageBackground` colour of each native project.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HotCodePush Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Bundle version</p>
        <h1 id="version"></h1>
      </header>
      <dl>
        <div>
          <dt>Current release</dt>
          <dd id="current-release">…</dd>
        </div>
        <div>
          <dt>Device id</dt>
          <dd id="device-id">…</dd>
        </div>
        <div>
          <dt>Last sync</dt>
          <dd id="last-sync">…</dd>
        </div>
        <div>
          <dt>Last rollback</dt>
          <dd id="last-rollback">none</dd>
        </div>
      </dl>
      <div class="actions">
        <button id="sync-button" type="button">Sync now</button>
        <button id="debug-button" type="button" class="secondary">
          Debug screen
        </button>
      </div>
    </main>
  </body>
</html>
